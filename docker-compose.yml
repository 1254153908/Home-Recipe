# ==========================================
# HomeRecipe 生产环境部署
# 使用: docker compose up -d
# ==========================================

services:
  # ==================== 基础设施 ====================
  mysql:
    image: mysql:8.0.42
    container_name: mysql
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: eng123
      MYSQL_DATABASE: home_recipe
    ports:
      - "3307:3306"  # 开发时可暴露，生产可注释掉
    volumes:
      - ./backend/docker/mysql/data/:/var/lib/mysql/
      - ./backend/docker/mysql/conf/:/etc/mysql/conf.d/
    command:
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    privileged: true
    restart: always
    networks:
      - recipe-net

  redis:
    image: redis:7.2.8
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass eng123
    volumes:
      - ./backend/docker/redis/data/:/data/
    restart: always
    networks:
      - recipe-net

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      TZ: Asia/Shanghai
      MINIO_ROOT_USER: homecooker
      MINIO_ROOT_PASSWORD: 12345678
    volumes:
      - ./backend/docker/minio/data:/data
      - ./backend/docker/minio/config:/root/.minio/
    command: server --address ':9000' --console-address ':9001' /data
    privileged: true
    restart: always
    networks:
      - recipe-net

  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: ["sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 homecooker 12345678 2>/dev/null; do
          echo "等待 MinIO 启动..."; sleep 2;
        done
        mc mb -p local/contract 2>/dev/null || true
        mc anonymous set public local/contract
        echo "contract 桶已设为公开读 (public)"
        mc mb -p local/recipe 2>/dev/null || true
        mc anonymous set public local/recipe
        echo "recipe 桶已设为公开读 (public)"
    restart: "no"
    networks:
      - recipe-net

  # ==================== Python AI 识别服务 ====================
  python-ai:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    container_name: python-ai
    ports:
      - "5000:5000"
    environment:
      TZ: Asia/Shanghai
    env_file:
      - ./backend/python/.env
    restart: always
    networks:
      - recipe-net

  # ==================== Java 后端 ====================
  java-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: java-backend
    ports:
      - "4993:4993"
    environment:
      TZ: Asia/Shanghai
      # 覆盖 application.yml 中的连接地址为容器网络地址
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/home_recipe?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: eng123
      AI_MOCK_SERVICE_URL: http://python-ai:5000/api/recognize
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: homecooker
      MINIO_SECRET_KEY: 12345678
      MINIO_BUCKET: recipe
      MINIO_ENABLED: "true"
    volumes:
      # 本地文件上传目录持久化（MinIO 禁用时使用）
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      python-ai:
        condition: service_started
    restart: always
    networks:
      - recipe-net

  # ==================== Nginx (前端 + 反向代理) ====================
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"  # HTTPS（配置 SSL 证书后启用）
    volumes:
      # 前端构建产物挂载到 Nginx 静态目录
      - ./frontend/dist:/usr/share/nginx/html:ro
      # Nginx 配置文件
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书目录（后续配置 HTTPS 时使用）
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - java-backend
    restart: always
    networks:
      - recipe-net

# ==================== 数据卷 ====================
volumes:
  uploads_data:

# ==================== 网络 ====================
networks:
  recipe-net:
    driver: bridge
