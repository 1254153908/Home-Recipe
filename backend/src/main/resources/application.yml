server:
  port: 4993

spring:
  jackson:
    deserialization:
      accept-single-value-as-array: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/home_recipe?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: eng123
  redis:
    host: localhost
    port: 6379
    password: eng123

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.huhu.recipe.recipe.entity,org.huhu.recipe.mealplan.entity,org.huhu.recipe.cookinglog.entity,org.huhu.recipe.ingredient.entity,org.huhu.recipe.seasoning.entity,org.huhu.recipe.shoppinglist.entity,org.huhu.recipe.auth.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

ai:
  mock-service:
    url: http://localhost:5000/api/recognize

upload:
  local-dir: uploads

minio:
  enabled: true
  endpoint: http://localhost:9000
  access-key: homecooker
  secret-key: 12345678
  bucket: recipe

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: homerecipe

jwt:
  secret: ${JWT_SECRET:home-recipe-jwt-secret-key-2026-must-be-at-least-256-bits-long}
  expiration: 604800  # 7 天，单位秒
