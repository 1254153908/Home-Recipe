server:
  port: 4993

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 真实 MySQL 连接，请按你的环境修改
    url: jdbc:mysql://localhost:3307/home_recipe?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: eng123

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: org.huhu.recipe.recipe.entity,org.huhu.recipe.mealplan.entity,org.huhu.recipe.cookinglog.entity,org.huhu.recipe.ingredient.entity,org.huhu.recipe.seasoning.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# AI 识别服务（Python FastAPI）地址
ai:
  mock-service:
    url: http://localhost:5000/api/recognize

# 文件上传配置
upload:
  local-dir: uploads

# MinIO 对象存储（默认不启用，留空走本地存储）
minio:
  enabled: true
  endpoint: http://localhost:9000
  access-key: homecooker
  secret-key: 12345678
  bucket: recipe

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus    # 只暴露 healh 和 prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: homerecipe          # 所有指标自动带上应用名称