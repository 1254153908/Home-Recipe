services:
  mysql:
    image: mysql:8.0.42
    container_name: mysql
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # root 密码
      MYSQL_ROOT_PASSWORD: eng123
      # 初始化数据库
      MYSQL_DATABASE: home_recipe
    ports:
      - "3307:3306"
    volumes:
      # 数据挂载
      - ../docker/mysql/data/:/var/lib/mysql/
      # 配置挂载
      - ../docker/mysql/conf/:/etc/mysql/conf.d/
    command:
      # 将mysql8.0默认密码策略 修改为 原先 策略 (mysql8.0对其默认策略做了更改 会导致密码无法匹配)
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    privileged: true
    # network_mode: "host"

  redis:
    image: redis:7.2.8
    container_name: redis
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command: redis-server --requirepass eng123
    volumes:
      - ../docker/redis/data/:/data/

  minio:
    # minio 最后一个未阉割版本 不能再进行升级 在往上的版本功能被阉割
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    ports:
      # api 端口
      - "9000:9000"
      # 控制台端口
      - "9001:9001"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # 管理后台用户名
      MINIO_ROOT_USER: homecooker
      # 管理后台密码，最小8个字符
      MINIO_ROOT_PASSWORD: 12345678
      # https需要指定域名
      #MINIO_SERVER_URL: "https://xxx.com:9000"
      #MINIO_BROWSER_REDIRECT_URL: "https://xxx.com:9001"
      # 开启压缩 on 开启 off 关闭
      MINIO_COMPRESS: "off"
      # 扩展名 .pdf,.doc 为空 所有类型均压缩
      MINIO_COMPRESS_EXTENSIONS: ""
      # mime 类型 application/pdf 为空 所有类型均压缩
      MINIO_COMPRESS_MIME_TYPES: ""
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
    volumes:
      # 映射当前目录下的data目录至容器内/data目录
      - ../docker/minio/data:/data
      # 映射配置目录
      - ../docker/minio/config:/root/.minio/
    command: server --address ':9000' --console-address ':9001' /data  # 指定容器中的目录 /data
    privileged: true
    # network_mode: "host"

  # 一次性初始化容器：MinIO 启动后自动创建所需桶并设为公开读
  # 复用已本地存在的 minio 镜像（内含 /usr/bin/mc），无需联网拉取
  # 每执行 `docker compose up` 时运行一次；桶策略写在数据卷中，重建数据卷也会重新生效
  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio-init
    depends_on:
      - minio
    entrypoint: ["sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 homecooker 12345678 2>/dev/null; do
          echo "等待 MinIO 启动..."; sleep 2;
        done
        mc mb -p local/contract 2>/dev/null || true
        mc anonymous set public local/contract
        echo "contract 桶已设为公开读 (public)"
        mc mb -p local/recipe 2>/dev/null || true
        mc anonymous set public local/recipe
        echo "recipe 桶已设为公开读 (public)"
    restart: "no"
